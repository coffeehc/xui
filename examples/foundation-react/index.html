<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>xui 基础消费者</title><link rel="icon" href="data:,">
<script>
(()=>{let settings={appearance:{mode:'system'},other:'保留宿主字段'};try{const stored=JSON.parse(localStorage.getItem('xui.example.host-settings')||'null');if(stored&&typeof stored==='object')settings={...settings,...stored};}catch{}const valid=mode=>['light','dark','system'].includes(mode);const mode=valid(settings.appearance?.mode)?settings.appearance.mode:'system';window.foundationHost={getSettings:()=>settings};window.xuiThemeOptions={mode,onModeChange(next){settings={...settings,appearance:{...settings.appearance,mode:next}};try{localStorage.setItem('xui.example.host-settings',JSON.stringify(settings));}catch{}window.xuiThemeOptions.mode=next;window.xuiTheme.syncMode(next);}};})();
</script><script src="./theme-init.js"></script><link rel="stylesheet" href="./app.css"></head><body class="xui"><div id="root"><div class="xui-shell"><header class="xui-shell-header"><strong>xui</strong><span>工作记录</span></header><main class="xui-shell-main"><div class="xui-container xui-stack"><header class="xui-page-header"><div><h1>记录列表</h1><p>当前共三条记录</p></div><div class="xui-toolbar"><button type="button" class="xui-button" disabled aria-busy="true">新建记录</button></div></header><div class="xui-state" role="status" data-startup><span class="xui-spinner" aria-hidden="true"></span>正在加载界面。</div></div></main></div></div><script>
(()=>{const failed=()=>{const node=document.querySelector('[data-startup]');if(!node)return;node.className='xui-state xui-state-error';node.setAttribute('role','alert');node.replaceChildren();const text=document.createElement('strong');text.textContent='界面加载失败';const retry=document.createElement('button');retry.type='button';retry.className='xui-button';retry.textContent='重新加载界面';retry.onclick=()=>location.reload();node.append(text,retry);};window.foundationStartup={fail:failed,ready(){window.removeEventListener('error',failed);document.querySelector('[data-startup]')?.remove();}};window.addEventListener('error',failed);})();
</script><script type="module" src="./app.js" onerror="window.foundationStartup.fail()"></script></body></html>
