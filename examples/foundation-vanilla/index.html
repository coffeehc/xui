<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>xui 基础消费者</title><link rel="icon" href="data:,">
<script>
(()=>{let settings={appearance:{mode:'system'},other:'保留宿主字段'};try{const stored=JSON.parse(sessionStorage.getItem('xui.example.host-settings')||'null');if(stored&&typeof stored==='object')settings={...settings,...stored};}catch{}const valid=mode=>['light','dark','system'].includes(mode);const mode=valid(settings.appearance?.mode)?settings.appearance.mode:'system';window.foundationHost={getSettings:()=>settings};window.xuiThemeOptions={mode,onModeChange(next){settings={...settings,appearance:{...settings.appearance,mode:next}};try{sessionStorage.setItem('xui.example.host-settings',JSON.stringify(settings));}catch{}window.xuiThemeOptions.mode=next;window.xuiTheme.syncMode(next);}};})();
</script><script src="./theme-init.js"></script><link rel="stylesheet" href="./app.css"></head><body class="xui"><div class="xui-shell" id="shell"><a class="xui-skip-link" href="#main">跳到主内容</a><header class="xui-shell-header"><button type="button" class="xui-button xui-shell-toggle" aria-label="打开导航" data-xui-sidebar-toggle>☰</button><strong>xui</strong><span>工作记录</span></header>
<aside class="xui-shell-sidebar" data-xui-sidebar><nav class="xui-nav" aria-label="工作导航"><a class="xui-nav-item" href="#list" aria-current="page" data-page-link="list">列表</a><a class="xui-nav-item" href="#form" data-page-link="form">表单</a><a class="xui-nav-item" href="#details" data-page-link="details">详情</a></nav></aside>
<main class="xui-shell-main" id="main" tabindex="-1"><div class="xui-container xui-stack"><header class="xui-page-header"><div><h1 id="page-title">记录列表</h1><p id="page-description">当前共三条记录</p></div><div class="xui-toolbar"><button type="button" class="xui-button" id="primary-action" disabled aria-busy="true">新建记录</button></div></header>
<div class="xui-toolbar" role="group" aria-label="显示设置"><div class="xui-field"><label class="xui-label" for="appearance">外观</label><select class="xui-select" id="appearance"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div></div>
<div class="xui-state" role="status" data-startup><span class="xui-spinner" aria-hidden="true"></span>正在加载界面。</div><section class="xui-section" data-page="list" aria-labelledby="list-title"><header class="xui-section-header"><h2 id="list-title">所有记录</h2></header><div class="xui-toolbar" role="group" aria-label="列表筛选"><div class="xui-field"><label class="xui-label" for="search">搜索记录</label><input class="xui-input" id="search"></div><button type="button" class="xui-button" data-variant="outline" id="clear-search" disabled>清除搜索</button></div>
<div class="xui-table-container" tabindex="0" role="region" aria-label="记录表格" id="table-region"><table class="xui-table"><caption class="xui-table-caption">记录与当前状态</caption><thead><tr><th scope="col">选择</th><th scope="col" aria-sort="ascending" id="sort-header"><button type="button" class="xui-sort-button" id="sort">编号 ↑</button></th><th scope="col">名称</th><th scope="col">状态</th></tr></thead><tbody id="records"></tbody></table></div><div class="xui-state" id="empty-records" hidden><strong>没有匹配记录</strong><button type="button" class="xui-button" id="clear-condition">清除条件</button></div><nav class="xui-pagination" aria-label="分页"><button type="button" class="xui-button" disabled>上一页</button><span>1 / 1</span><button type="button" class="xui-button" disabled>下一页</button></nav></section>
<section class="xui-section" data-page="form" hidden aria-labelledby="form-title"><header class="xui-section-header"><h2 id="form-title">基本信息</h2></header><form class="xui-stack" id="record-form" novalidate><div class="xui-grid"><div class="xui-field"><label class="xui-label" for="record-name">名称 *</label><input class="xui-input" id="record-name" required value="新记录" aria-describedby="name-error"><p class="xui-error" id="name-error" hidden></p></div><div class="xui-field"><label class="xui-label" for="note">备注</label><textarea class="xui-textarea" id="note">保留输入，再调整外观。</textarea></div></div><fieldset class="xui-fieldset"><legend class="xui-label">通知方式</legend><label class="xui-choice-label"><input class="xui-choice" type="radio" name="notify" value="inbox" checked>站内</label><label class="xui-choice-label"><input class="xui-choice" type="radio" name="notify" value="email">邮件</label></fieldset><div class="xui-toolbar"><button type="submit" class="xui-button" id="save-record">确认保存</button><button type="button" class="xui-button" data-variant="outline" data-page-link="list">取消编辑</button></div><p role="status" id="save-status" hidden>记录已保存在示例内存中。</p></form></section>
<section class="xui-section" data-page="details" hidden aria-labelledby="detail-title"><header class="xui-section-header"><h2 id="detail-title">基本信息</h2></header><nav class="xui-breadcrumbs" aria-label="当前位置"><ol><li><a href="#list" data-page-link="list">记录</a></li><li aria-current="page">资料整理</li></ol></nav><dl class="xui-details"><dt>编号</dt><dd>A-01</dd><dt>名称</dt><dd>资料整理</dd><dt>状态</dt><dd>进行中</dd></dl><button type="button" class="xui-button" data-variant="outline" data-page-link="list">返回列表</button></section>
<section class="xui-section" aria-labelledby="tools-title"><header class="xui-section-header"><h2 id="tools-title">附加工具</h2><div class="xui-toolbar"><button type="button" class="xui-button" data-variant="outline" id="open-tools">打开工具</button><button type="button" class="xui-button" data-variant="ghost" id="cancel-tools" hidden>取消加载</button></div></header><section class="xui-data-region" id="tools-region" aria-busy="false" aria-label="工具区域"><div id="tools-content"><div class="xui-state"><strong>工具尚未打开</strong></div></div><div id="tools-feedback"></div></section></section>
</div></main><dialog class="xui-native-dialog xui-layer xui-shell-drawer" data-xui-sidebar-dialog aria-labelledby="navigation-title"><h2 id="navigation-title" class="xui-dialog-title">打开导航</h2><div class="xui-dialog-body" data-xui-sidebar-content></div><div class="xui-dialog-footer"><button type="button" class="xui-button" data-variant="outline" data-xui-close>关闭导航</button></div></dialog></div><script>
(()=>{const failed=()=>{const node=document.querySelector('[data-startup]');if(!node)return;node.className='xui-state xui-state-error';node.setAttribute('role','alert');node.replaceChildren();const text=document.createElement('strong');text.textContent='界面加载失败';const retry=document.createElement('button');retry.type='button';retry.className='xui-button';retry.textContent='重新加载界面';retry.onclick=()=>location.reload();node.append(text,retry);};window.foundationStartup={fail:failed,ready(){window.removeEventListener('error',failed);document.querySelector('[data-startup]')?.remove();}};window.addEventListener('error',failed);})();
</script><script type="module" src="./app.js" onerror="window.foundationStartup.fail()"></script></body></html>
