<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>xui 请求与查询</title><link rel="icon" href="data:,"><script src="./theme-init.js"></script><link rel="stylesheet" href="./app.css"></head><body class="xui"><div id="root"><div class="xui-stack"><header class="xui-page-header"><h1>记录查询</h1><button class="xui-button" type="button" id="refresh">刷新记录</button></header><form class="xui-toolbar" id="filter" aria-label="记录筛选"><div class="xui-field"><label class="xui-label" for="http-name">名称</label><input class="xui-input" id="http-name"></div><button type="submit" class="xui-button">应用筛选</button><div class="xui-field"><label class="xui-label" for="http-sort">排序</label><select class="xui-select" id="http-sort"><option value="asc">名称升序</option><option value="desc">名称降序</option></select></div><button type="button" class="xui-button" data-variant="outline" id="cancel" hidden>取消读取</button></form><div class="xui-alert" data-tone="warning" id="auth" role="status" hidden>需要重新认证。认证请求已交给宿主处理：<span data-auth-count>0</span></div><section class="xui-data-region" aria-label="记录结果" id="results" aria-busy="false"><div id="data" hidden><p role="status" data-total></p><div class="xui-table-container" role="region" aria-label="参考记录表格" tabindex="0"><table class="xui-table"><caption class="xui-table-caption">合成参考记录</caption><thead><tr><th scope="col">名称</th><th scope="col">创建时间</th></tr></thead><tbody id="rows"></tbody></table></div><div class="xui-state" id="empty" hidden><strong>没有匹配记录</strong></div><nav class="xui-pagination" aria-label="分页"><button type="button" class="xui-button" id="previous">上一页</button><span id="page"></span><button type="button" class="xui-button" id="next">下一页</button></nav></div><div id="feedback"></div></section></div></div><script type="module" src="./app.js"></script></body></html>
