<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>xui · 原生消费示例</title>
<script src="./theme-init.js"></script><link rel="stylesheet" href="./app.css"></head>
<body class="xui"><header class="demo-header"><strong>xui</strong><span>原生示例</span></header>
<div class="demo-layout"><nav class="xui-nav" aria-label="示例导航">
<a href="#preferences" class="xui-nav-item" aria-current="page">偏好</a><a href="#details" class="xui-nav-item">详情</a>
</nav><main class="demo-main" id="preferences"><h1>工作偏好</h1><p class="demo-status" id="status" role="status">草稿尚未保存</p>
<form class="demo-form" novalidate><div class="xui-field"><label class="xui-label" for="name">名称 <span aria-hidden="true">*</span></label>
<input class="xui-input" id="name" name="name" value="我的工作空间" required aria-describedby="name-error"><p id="name-error" class="xui-error" hidden></p></div>
<div class="demo-fields"><div class="xui-field"><label class="xui-label" for="theme">外观</label><select id="theme" class="xui-select"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div>
<div class="xui-field"><label class="xui-label" for="brand">主题配方</label><select id="brand" class="xui-select"><option value="default">暖灰青绿</option><option value="example">蓝色覆盖</option></select></div></div>
<div class="demo-row"><label class="xui-choice-label"><input class="xui-choice" type="checkbox" id="notify" checked>允许提醒</label><label class="xui-choice-label"><input class="xui-choice" type="checkbox" role="switch" id="organize">自动整理</label></div>
<fieldset class="demo-choice-group"><legend>提醒方式</legend><label class="xui-choice-label"><input class="xui-choice" type="radio" name="channel" value="inbox" checked>站内</label><label class="xui-choice-label"><input class="xui-choice" type="radio" name="channel" value="email">邮件</label></fieldset>
<div class="demo-row"><button type="submit" class="xui-button">保存偏好</button><button type="button" class="xui-button" data-variant="outline" id="help">使用说明</button><button type="button" class="xui-button" disabled aria-busy="true">等待同步</button></div>
<div id="feedback" class="demo-feedback" aria-live="polite"></div></form>
<section class="xui-surface demo-detail" id="details" aria-label="更多设置"><h2>更多设置</h2><div class="xui-field"><label for="note" class="xui-label">备注</label><textarea class="xui-textarea" id="note">保留草稿，随时调整。</textarea></div><div class="demo-row"><button class="xui-button" data-icon="true" data-variant="ghost" aria-label="清空备注" id="clear-note"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" fill="none" stroke-width="var(--icon-stroke-width)"/></svg></button><input aria-label="只读标识" class="xui-input" readonly value="workspace-demo"></div></section>
</main></div>
<dialog id="help-dialog" class="xui-native-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><h2 id="dialog-title" class="xui-dialog-title">使用说明</h2><p id="dialog-description" class="xui-dialog-description">偏好仅保存在此示例的内存中，外观选择保存在此浏览器。</p><div class="xui-dialog-body"><p>主题切换保留名称与备注。取消不会保存草稿。</p><div id="long-help"></div></div><div class="xui-dialog-footer"><button class="xui-button" data-variant="outline" id="cancel-help" type="button">取消</button></div></dialog>
<script type="module" src="./app.js"></script></body></html>
