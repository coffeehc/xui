<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>xui 公共能力</title><script src="./theme-init.js"></script><link rel="stylesheet" href="./app.css"></head><body class="xui"><main id="root" class="xui-container xui-stack"><header class="xui-page-header"><h1>公共能力</h1><div class="xui-toolbar"><button class="xui-button" id="open-sheet">打开侧栏</button><button class="xui-button" id="download">下载报告</button><button class="xui-button" data-variant="outline" id="cancel-download" hidden>取消下载</button></div></header><p id="status" role="status">菜单执行 0 次</p><div class="xui-context-trigger" id="context-trigger" tabindex="0" aria-label="记录操作区域">记录操作区域</div><div class="xui-layer xui-floating xui-menu-popup" id="context-popup"><button class="xui-menu-item" role="menuitem">查看记录</button><button class="xui-menu-item" role="menuitem" disabled>不可用操作</button><button class="xui-menu-item" role="menuitemcheckbox" aria-checked="false">保留菜单选择</button></div><div class="xui-table-container" role="region" aria-label="公共表格" tabindex="0"><table class="xui-table" data-striped="true"><thead><tr><th data-sticky="start">编号</th><th>详情</th><th>内容</th><th data-sticky="end">操作</th></tr></thead><tbody id="rows"></tbody></table></div><details><summary>访问密钥标准接口</summary><div id="keys"></div></details><details><summary>业务日志标准接口</summary><div id="logs"></div></details><dialog class="xui-native-dialog xui-layer" id="sheet" aria-labelledby="sheet-title"><h2 class="xui-dialog-title" id="sheet-title">编辑侧栏</h2><div class="xui-dialog-body" id="sheet-body"><label class="xui-label" for="draft">草稿</label><input class="xui-input" id="draft" value="保留草稿"></div><footer class="xui-dialog-footer"><button class="xui-button" data-xui-close>关闭侧栏</button></footer><dialog class="xui-native-dialog xui-layer" id="alert" aria-labelledby="alert-title" aria-describedby="alert-description"><h2 class="xui-dialog-title" id="alert-title">放弃未保存草稿？</h2><p class="xui-dialog-description" id="alert-description">放弃后本地草稿会清空。</p><footer class="xui-dialog-footer"><button class="xui-button" data-variant="outline" data-xui-close data-xui-cancel id="keep">继续编辑</button><button class="xui-button" data-variant="destructive" id="discard">确认放弃</button></footer></dialog></dialog></main><script type="module" src="./app.js"></script></body></html>
