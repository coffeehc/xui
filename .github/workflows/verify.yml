name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install standard CJK validation fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk && fc-match "sans-serif:lang=zh-cn"
      - name: Build and validate public consumers
        run: pnpm build && pnpm check:tokens && pnpm typecheck && pnpm test:unit && pnpm test:consumer
      - name: Authentication visual acceptance
        run: pnpm exec playwright test auth-visual-system.spec.mjs login-visual.spec.mjs auth-page.spec.mjs auth-feedback-readable.spec.mjs
      - name: Preserve authentication visual evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authentication-visual
          path: test-results
      - name: Focused interaction regressions
        run: pnpm exec playwright test input-typography-contract.spec.mjs button-state-contract.spec.mjs table-actions.spec.mjs design-state-regressions.spec.mjs table-design-contract.spec.mjs menu-design-contract.spec.mjs context-submenu.spec.mjs foundation-contract.spec.mjs data-table-caption-shape.spec.mjs data-table-feedback.spec.mjs data-table-widths.spec.mjs data-table-layout.spec.mjs data-table.spec.mjs api-key-atomic.spec.mjs auth-operation.spec.mjs login-layout.spec.mjs login.spec.mjs error-layout.spec.mjs capabilities.spec.mjs search-toolbar.spec.mjs display.spec.mjs choice-group.spec.mjs password-fields.spec.mjs password-strength.spec.mjs admin-setup.spec.mjs text-inputs.spec.mjs
      - name: Preserve focused interaction evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-interactions
          path: test-results
      - name: Watch, cold start and complete browser suite
        run: pnpm test:watch && pnpm test:cold-start && pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            test-results
            .artifacts/vite-regression-*/results.json
            .artifacts/public-api.json
