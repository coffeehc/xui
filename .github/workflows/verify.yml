name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            test-results
            .artifacts/vite-regression-*/results.json
            .artifacts/public-api.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-visual-acceptance
          if-no-files-found: warn
          path: |
            test-results/login-visual-*/*.png
            test-results/login-visual-*/*.json
            test-results/login-navigation-*/*.png
            test-results/login-navigation-*/*.json
            test-results/auth-page-*/*.png
            test-results/auth-page-*/*.json
