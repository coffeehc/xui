name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and validate public consumers
        run: pnpm build && pnpm check:tokens && pnpm typecheck && pnpm test:unit && pnpm test:consumer
      - name: Focused interaction regressions
        run: pnpm exec playwright test auth-operation.spec.mjs login-layout.spec.mjs login.spec.mjs error-layout.spec.mjs capabilities.spec.mjs search-toolbar.spec.mjs display.spec.mjs choice-group.spec.mjs
      - name: Watch, cold start and complete browser suite
        run: pnpm test:watch && pnpm test:cold-start && pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            test-results
            .artifacts/vite-regression-*/results.json
            .artifacts/public-api.json
